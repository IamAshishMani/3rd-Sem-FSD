<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirTag Mockup</title>
    
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f7;
      font-family: Arial, sans-serif;
    }

    .airtag {
      width: 220px;
      height: 220px;
      background: white;
      border-radius: 50%;
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.15),
        inset 0 0 0 2px #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: #111;
      font-weight: bold;
    }

    .airtag::after {
      content: "";
      position: absolute;
      bottom: 12px;
      width: 45px;
      height: 6px;
      border-radius: 10px;
      background: #ddd;
    }
  </style>
</head>

<body>

  <div class="airtag">
    <div class="logo"></div>
  </div>

</body>
</html>
